server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:saapgs;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
saapgs:
  model:
    provider: mock
  bedrock:
    model-id: ${SAAPGS_BEDROCK_MODEL_ID:anthropic.claude-3-haiku-20240307-v1:0}
aws:
  region: ${AWS_REGION:us-east-1}
logging:
  level:
    com.example.saapgs: INFO
